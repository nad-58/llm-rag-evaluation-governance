name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Compile sources
        run: python -m compileall -q src examples tests
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run examples
        run: |
          python examples/rag_answer_evaluation.py
          python examples/retrieval_quality_report.py
          python examples/hallucination_risk_report.py
      - name: Audit dependencies
        run: pip-audit
