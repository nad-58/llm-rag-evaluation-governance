[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-rag-evaluation-governance"
version = "0.1.0"
description = "Lightweight utilities and templates for evaluating and governing LLM and RAG systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ehsan Nadernejad"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pip-audit>=2.7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
